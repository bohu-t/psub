name: rebuild-rules

on:
  schedule:
    # 每天 05:17（Asia/Shanghai）= 21:17 UTC
    - cron: "17 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Rebuild rules
        run: |
          cd rules
          python3 build.py

      - name: Commit changed dist
        run: |
          git config user.name "rules-bot"
          git config user.email "rules-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain rules/dist)" ]; then
            git add rules/dist
            git commit -m "chore(rules): 自动重建 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "dist 无变化，跳过提交"
          fi
